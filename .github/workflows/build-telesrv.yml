name: Build telesrv (linux/amd64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-telesrv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build telesrv
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build telesrv (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/telesrv-linux-amd64 ./cmd/telesrv

      - name: Binary info
        run: |
          ls -lh dist/
          file dist/telesrv-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telesrv-linux-amd64
          path: dist/telesrv-linux-amd64
          if-no-files-found: error
          retention-days: 7
